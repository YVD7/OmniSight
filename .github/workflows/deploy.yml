name: Deploy OmniSight to Azure VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            info() { echo -e "🚀  $*"; }
            error() { echo -e "❌  $*" >&2; }

            # Install Docker Engine (if missing)
            info "🛠️  Installing Docker Engine (if missing)…"
            if ! command -v docker &>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            else
              info "✅ Docker already installed."
            fi

            sudo usermod -aG docker "$USER" || true
            newgrp docker <<'EOF'
              docker version
              docker compose version
            EOF

            APP_DIR="/home/${USER}/OmniSight"
            info "📂  Ensuring application directory at $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -d ".git" ]; then
              info "🔄  Updating existing repo…"
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            else
              info "📥  Cloning repository…"
              git clone https://github.com/YVD7/OmniSight.git .
            fi

            cat > .env <<'EOF'
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
            AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
            AZURE_STORAGE_CONTAINER_NAME=${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
            GH_REPO_URL=${{ secrets.TARGET_REPO_URL }}
            GH_TOKEN=${{ secrets.TARGET_TOKEN }}
            GH_BRANCH=${{ secrets.TARGET_BRANCH }}
            BASE_URL=${{ secrets.BASE_URL }}
            EOF

            info "📦  Building & starting Docker stack"
            # Bring down any previous compose stack
            docker compose down || true
            # Build and bring up anew
            docker compose up -d --build

            HEALTH_URL="http://localhost:8000/status"
            info "🔍  Waiting for FastAPI health endpoint ($HEALTH_URL)…"
            for i in {1..12}; do
              if curl -sSf "$HEALTH_URL" > /dev/null; then
                info "✅  API is healthy after $((i*5)) s"
                break
              fi
              info "⏳  Attempt $i/12 – still waiting…"
              sleep 5
            done

            if ! curl -sSf "$HEALTH_URL" > /dev/null; then
              error "❌  API health check failed after 60 s"
              info "📜  Last 50 lines of each container log:"
              for CONTAINER in $(docker ps --format "{{.Names}}"); do
                echo "=== $CONTAINER ==="
                docker logs --tail 50 "$CONTAINER"
              done
              exit 1
            fi

            info "✅  OmniSight successfully deployed on Azure VM!"
