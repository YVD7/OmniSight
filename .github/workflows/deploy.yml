name: Deploy OmniSight to Azure VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Deployment on Azure VM..."
            
            # Check if Docker is installed on the Azure VM; install if missing
            if ! command -v docker &> /dev/null; then
              echo "🐳 Docker not found on Azure VM. Auto-installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER || true
              rm get-docker.sh
            fi

            # Check if Docker Compose plugin is installed
            if ! docker compose version &> /dev/null; then
              echo "🐳 Docker Compose plugin not found. Installing docker-compose-plugin..."
              sudo apt-get update && sudo apt-get install -y docker-compose-plugin || true
            fi

            # Navigate to application directory
            mkdir -p /home/${{ secrets.AZURE_VM_USERNAME }}/OmniSight
            cd /home/${{ secrets.AZURE_VM_USERNAME }}/OmniSight

            # Git pull latest changes
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Inject secrets into .env.secrets file (Note: GitHub Action Secrets must NOT start with GITHUB_)
            cat << 'EOF' > .env.secrets
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
            AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
            AZURE_STORAGE_CONTAINER_NAME=${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
            GH_REPO_URL=${{ secrets.TARGET_REPO_URL }}
            GH_TOKEN=${{ secrets.TARGET_TOKEN }}
            GH_BRANCH=${{ secrets.TARGET_BRANCH }}
            BASE_URL=${{ secrets.BASE_URL }}
            EOF

            # Copy to .env if needed
            cp .env.secrets .env

            # Build and restart containers using Docker Compose
            echo "📦 Building and starting Docker containers..."
            docker compose down || true
            docker compose up -d --build

            # Verify API health with retry loop
            echo "🔍 Verifying deployment health status..."
            HEALTH_CHECK_PASSED=0
            for i in {1..12}; do
              if curl -s -f http://localhost:8000/api/status > /dev/null; then
                HEALTH_CHECK_PASSED=1
                echo "✅ API is online and responding at http://localhost:8000/api/status"
                break
              fi
              echo "⏳ Waiting for API container to initialize (Attempt $i/12)..."
              sleep 5
            done

            if [ $HEALTH_CHECK_PASSED -ne 1 ]; then
              echo "❌ API Healthcheck failed after 60 seconds!"
              docker compose logs --tail=50
              exit 1
            fi

            echo "✅ OmniSight successfully deployed via Docker on Azure VM!"
