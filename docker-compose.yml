services:
  # OmniSight Gateway API & LangGraph VLM Orchestrator
  omnisight-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnisight-api
    ports:
      - "8000:8000"
    env_file:
      - .env.secrets
      - .env
    environment:
      # Azure Database for PostgreSQL Configuration
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Azure Blob Storage Container Configuration
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}

      # Target GitHub Web App Configuration (GH_ prefix compliant with GitHub Secrets)
      GH_REPO_URL: ${GH_REPO_URL}
      GH_TOKEN: ${GH_TOKEN}
      GH_BRANCH: ${GH_BRANCH}
      BASE_URL: ${BASE_URL}

      # GEMINI_API_KEY
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      
    volumes:
      - ./output:/app/output
      - ./db:/app/db
      - ./trailhead-mock-store:/app/trailhead-mock-store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
